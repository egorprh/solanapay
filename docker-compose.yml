services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: solana_payments
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  bot:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./bot/.env
    environment:
      # Для библиотеки solana_payments (используется ботом)
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      # RPC по умолчанию — mainnet; можно переопределить через .env
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      PYTHONUNBUFFERED: "1"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "pip install -r solana_payments/requirements.txt && pip install -r bot/requirements.txt && python -m bot.bot"
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
